name: Send Weekly Digest Email

on:
  #schedule:
  #  # Monday 9:26 AM Sydney time
  #  - cron: '26 9 * * 1'
  #    timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build HTML, skip sending)'
        required: false
        default: 'false'
        type: boolean
      audience:
        description: 'Resend audience to send to'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - test
      banner:
        description: 'Banner under the header (feedback weeks override it)'
        required: false
        default: 'social'
        type: choice
        options:
          - social
          - signup
      post_to_linkedin:
        description: 'Also post the digest to LinkedIn (production sends only)'
        required: false
        default: true
        type: boolean

jobs:
  send-email:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Shallow clone is enough — we only need digest.json
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The full set: the LinkedIn step imports the ATProto posting code
          pip install -r scripts/requirements.txt

      - name: Send weekly digest email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_TEST_AUDIENCE_ID: ${{ secrets.RESEND_TEST_AUDIENCE_ID }}
          # Scheduled runs have no inputs and default to production
          AUDIENCE: ${{ inputs.audience || 'production' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # social: follow us on LinkedIn/Bluesky; signup: "were you forwarded this?"
          BANNER: ${{ inputs.banner || 'social' }}
        run: python -m scripts.send_weekly_email

      # Production sends only: never after a test send or a dry run.
      # scripts/linkedin/digest.py re-checks AUDIENCE as well. Runs only once
      # the email has gone, so a red run here means the email is already out:
      # re-running the job would send it again, so post by hand instead.
      - name: Post the digest to LinkedIn
        # Scheduled runs have no inputs, so they post (the checkbox's default).
        # Spelled out because a missing input compares equal to false.
        if: >-
          ${{ (github.event_name == 'schedule' || inputs.post_to_linkedin)
              && !inputs.dry_run
              && (inputs.audience || 'production') == 'production' }}
        env:
          AUDIENCE: ${{ inputs.audience || 'production' }}
          LINKEDIN_WEBHOOK_URL: ${{ secrets.LINKEDIN_WEBHOOK_URL }}
          LINKEDIN_WEBHOOK_API_KEY: ${{ secrets.LINKEDIN_WEBHOOK_API_KEY }}
        run: python -m scripts.linkedin.digest

      - name: Upload rendered HTML preview
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-email-preview
          path: /tmp/digest_email_preview.html
          if-no-files-found: error
