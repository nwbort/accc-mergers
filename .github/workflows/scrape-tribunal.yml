name: Scrape Tribunal

# Fills in each tribunal_appeals.json entry's documents[] from the live
# Australian Competition Tribunal matter pages. The tribunal site is behind
# Cloudflare's managed challenge, so scripts/scrape_tribunal.py drives a real
# Chrome (headful, under Xvfb) via nodriver to solve it — which means this runs
# unattended in CI, unlike the old curl-based scraper. See that script's
# docstring and docs/deployment.md.

on:
  workflow_dispatch:
    inputs:
      merger_ids:
        description: 'Optional space-separated merger_ids to scrape (default: all with a tribunal_url)'
        required: false
        default: ''
  schedule:
    # Hourly, minute :23, from 8am to 7pm Sydney time (AEST, UTC+10).
    # GitHub Actions cron has no DST awareness, so this is pinned to a fixed
    # UTC+10 offset: during AEDT (roughly Oct-Apr) the actual window is
    # 9am-8pm Sydney rather than 8am-7pm.
    - cron: '23 22,23,0-9 * * *'

permissions:
  contents: write
  actions: write   # needed to trigger the pipeline workflow after a commit

concurrency:
  group: scrape-tribunal
  cancel-in-progress: false

jobs:
  scrape-tribunal:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-tribunal.txt

    - name: Install Chrome and Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        # google-chrome-stable is normally pre-installed on ubuntu-latest; make
        # sure it (or chromium) is present for nodriver to drive.
        if ! command -v google-chrome >/dev/null 2>&1; then
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
        fi
        CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
        echo "Resolved CHROME_PATH=$CHROME_PATH"
        "$CHROME_PATH" --version || true
        echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

    - name: Run the tribunal scraper
      # xvfb-run gives Chrome a display so it runs headful, which is far less
      # likely to be flagged by Cloudflare than headless.
      run: |
        xvfb-run -a python scripts/scrape_tribunal.py ${{ github.event.inputs.merger_ids }}

    - name: Compress oversized PDFs
      # Cloudflare Pages rejects an entire deployment if any single asset is
      # over 25 MiB, and tribunal exhibits are the documents most likely to
      # exceed it — scanned affidavits run to tens of megabytes. Shrink them
      # before they're committed, or the next site build fails. Runs on the same
      # always() basis as the commit below, so a partial scrape still gets it.
      if: always()
      run: |
        if find data/raw/matters -type f -name '*.pdf' -size +25M | grep -q .; then
          sudo apt-get update
          sudo apt-get install -y ghostscript --no-install-recommends
          # requirements-tribunal.txt is deliberately lean and has no PDF
          # library; compress_pdfs.py validates its output with pdfplumber, so
          # pull the main pipeline's pinned set in on the rare run that needs it
          # rather than pinning pdfplumber a second time in its own file.
          pip install -r scripts/requirements.txt
          python scripts/compress_pdfs.py
        else
          echo "No PDFs over the 25 MiB Pages asset limit"
        fi

    - name: Commit and push changes
      # Always run so any matters that did scrape are committed even if others
      # failed to clear the challenge (the run step exits non-zero in that case).
      if: always()
      id: commit
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/processed/tribunal_appeals.json data/raw/matters
        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "Update scraped tribunal data: $(TZ='Australia/Sydney' date)"
        git pull --rebase || { git rebase --abort; exit 1; }
        git push
        echo "committed=true" >> "$GITHUB_OUTPUT"

    - name: Trigger merger pipeline
      # Pushes made with the default GITHUB_TOKEN don't cascade to other
      # workflows' `push` triggers, so pipeline.yml's push-to-main trigger
      # never fires off the back of this commit. Kick it off explicitly
      # instead, same workaround pipeline.yml itself uses for its cli-sqlite
      # publish step.
      if: always() && steps.commit.outputs.committed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pipeline.yml --ref main
