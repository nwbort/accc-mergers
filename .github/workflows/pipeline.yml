# TEMPORARY (branch ccr-fd9f9203-1rwkzl only): the real pipeline is replaced by
# an access probe while diagnosing the ACCC's Akamai 403s. Revert this commit
# before merging. workflow_dispatch only runs files that exist on main, which
# is why this borrows pipeline.yml rather than adding a new workflow.
name: Merger pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi nodriver

      - name: Resolve Chrome
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version || true
          command -v xvfb-run

      - name: Probe accc.gov.au
        run: xvfb-run -a python -m scripts.scrape.probe_access

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-results
          path: probe-results.json
          retention-days: 7
