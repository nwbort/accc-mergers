name: Fix Missing Notification Dates

on:
  schedule:
    # Daily at 3:00 AM UTC — after extract has run so mergers.json is current.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write        # needed to push the suggestion branch
  pull-requests: write   # needed to create / update the suggestion PR

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Record base for detection
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same shape as the three detectors in pipeline.yml — branch off the
      # checked-out main, apply the suggestions, open or refresh the review PR,
      # close it when there is nothing left to suggest — so it uses the same
      # composite action rather than its own copy of the plumbing. That is also
      # what gives it the ntfy push, and the fingerprint check that keeps a
      # daily re-detection of the same unmerged candidates from sending one.
      - name: Missing notification dates review PR
        uses: ./.github/actions/detection-pr
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          branch: fix/missing-notification-dates
          heading: Missing notification dates
          command: >-
            python3 -m scripts.fix_missing_notification_dates
            --summary
            --apply-suggestions
            --pr-markdown pr_body.md
          data-file: data/known_notification_dates.json
          commit-message: "fix: default missing notification date(s) to {date}"
          pr-title: "fix: default missing notification date(s) ({date})"
          close-comment: >-
            All flagged mergers now have a notification date as of {date}.
            Closing automatically.
          github-token: ${{ github.token }}
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          ntfy-token: ${{ secrets.NTFY_TOKEN }}
          ntfy-server: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
