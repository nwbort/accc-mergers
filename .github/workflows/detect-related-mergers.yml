name: Detect Related Mergers

on:
  # Detection now runs as part of the main pipeline (pipeline.yml) on every
  # pipeline run. This standalone workflow is kept for manual re-runs only.
  workflow_dispatch:

permissions:
  contents: write        # needed to push the suggestion branch
  pull-requests: write   # needed to create / update the suggestion PR
  issues: write          # needed to open the auto-merge verification issue

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run related-merger detection
        id: detect
        run: |
          if python3 scripts/detect_related_mergers.py --summary; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        run: |
          {
            echo "### Related mergers detection"
            echo ""
            python3 scripts/detect_related_mergers.py --summary || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Switch to (or create/reset) the well-known suggestion branch so the
      # commit lands on top of the current default-branch HEAD.
      - name: Create or reset suggestion branch
        id: branch
        if: steps.detect.outputs.found == 'true'
        run: |
          BRANCH="fix/related-mergers"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git switch -C "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply suggested pairs
        if: steps.detect.outputs.found == 'true'
        run: |
          python3 scripts/detect_related_mergers.py \
            --apply-suggestions \
            --pr-markdown pr_body.md \
            --issue-markdown pr_issue_body.md \
            --meta-json pr_meta.json || true

      - name: Commit and push suggestion branch
        id: commit
        if: steps.detect.outputs.found == 'true'
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          if git diff --quiet data/processed/related_mergers.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/processed/related_mergers.json
            git commit -m "suggest: candidate related mergers detected on $(date -u +%Y-%m-%d)"
            git push origin "$BRANCH" --force
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        id: pr
        if: steps.detect.outputs.found == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          TITLE="suggest: link related mergers ($(date -u +%Y-%m-%d))"

          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file pr_body.md
            echo "Updated PR #$EXISTING"
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            NUMBER=$(gh pr create \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file pr_body.md \
              | grep -oE '[0-9]+$')
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # An exact (100%) name match on acquirer, target, and merger name for a
      # refiled waiver leaves essentially no room for a false positive (see
      # detect_related_mergers.is_certain_match), so that case is merged
      # immediately instead of waiting on manual review. A follow-up issue
      # still asks for a sanity check. Mixed batches (some exact, some not)
      # are conservatively left for manual review in their entirety, since a
      # PR merge can't be split pair-by-pair.
      - name: Auto-merge exact-match waiver-refile PR
        if: steps.detect.outputs.found == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [ -z "$PR_NUMBER" ] || [ "$(jq -r '.all_certain' pr_meta.json)" != "true" ]; then
            echo "Not an all-exact-match batch (or PR number missing) — leaving PR #$PR_NUMBER for manual review."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --squash

          gh label create "needs-verification" \
            --description "Auto-merged by automation; needs a human to double-check" \
            --color "fbca04" \
            --force

          TITLE="Verify auto-merged waiver refile(s) ($(date -u +%Y-%m-%d))"
          jq -n \
            --arg title "$TITLE" \
            --rawfile body pr_issue_body.md \
            '{"title": $title, "body": $body, "labels": ["needs-verification"]}' | \
          gh api "repos/$GITHUB_REPOSITORY/issues" --method POST --input -
          echo "Merged PR #$PR_NUMBER automatically and opened a verification issue"

      - name: Close suggestion PR when nothing left to recommend
        if: steps.detect.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --head "fix/related-mergers" \
            --state open \
            --json number \
            --jq '.[].number' | \
          while read -r num; do
            gh pr close "$num" \
              --comment "All detected related-merger pairs have been recorded as of $(date -u +%Y-%m-%d). Closing automatically." \
              || true
          done
