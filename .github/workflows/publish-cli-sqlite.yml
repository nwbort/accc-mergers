name: Publish CLI SQLite

# Manual republish of cli.sqlite + cli-manifest.json at the data version
# recorded on main, force-pushed to the orphan `cli-dist` branch.
# The accc-mergers-cli reads those two files directly from
# raw.githubusercontent.com:
#
#   https://raw.githubusercontent.com/nwbort/accc-mergers/cli-dist/cli-manifest.json
#   https://raw.githubusercontent.com/nwbort/accc-mergers/cli-dist/cli.sqlite
#
# The SQLite binary lives only on the orphan branch so it doesn't bloat the
# main history. Each run replaces the branch with a fresh single commit.
#
# Routine publishes happen inline at the end of pipeline.yml whenever a
# pipeline run pushes a change to cli-manifest.json. This workflow exists for
# manual republishes (e.g. after a schema change in build_cli_sqlite.py).
#
# Nothing the bundle is built from is committed as such: the bundle is made
# from generate_static_data's in-memory records, so this workflow regenerates
# everything from the committed sources first. It publishes at the version
# main's cli-manifest.json records and never bumps it (`--cli-bundle
# republish`). Regenerating on a later day can legitimately give a slightly
# different bundle than the one that version was stamped on (date-relative
# fields, such as a Federal Court listing date passing), so a mismatch is a
# warning on the run, not a failure: the content is still built from main's
# sources, and the next pipeline run notices the difference and publishes the
# next version. Bumping here instead would mint a version main never records,
# which that pipeline run would then stamp on different content. Files the
# regeneration rewrites are discarded with the runner; nothing is pushed to main.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cli-sqlite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # cli-bundle.json is gitignored, so a fresh checkout of main doesn't have
      # one. Regenerate it, pinned to the version main already records (see
      # the note at the top of this file).
      - name: Regenerate data and CLI bundle
        run: python -m scripts.generate.generate_static_data --cli-bundle republish

      - name: Build SQLite database
        run: |
          mkdir -p "${RUNNER_TEMP}/cli-dist"
          python -m scripts.generate.build_cli_sqlite \
            --bundle data/output/cli/cli-bundle.json \
            --output-dir "${RUNNER_TEMP}/cli-dist"
          echo "--- Manifest ---"
          cat "${RUNNER_TEMP}/cli-dist/cli-manifest.json"

      - name: Force-push to cli-dist orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          work="${RUNNER_TEMP}/cli-dist-publish"
          mkdir -p "$work"
          cp "${RUNNER_TEMP}/cli-dist/cli.sqlite" "$work/cli.sqlite"
          cp "${RUNNER_TEMP}/cli-dist/cli-manifest.json" "$work/cli-manifest.json"

          cd "$work"
          git init -q -b cli-dist
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          version=$(python -c 'import json,sys; print(json.load(open("cli-manifest.json"))["version"])')

          git add cli.sqlite cli-manifest.json
          git commit -q -m "Publish cli.sqlite (data version ${version})"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Single fresh orphan commit replaces whatever was on cli-dist.
          # Retry transient network failures with exponential backoff.
          for attempt in 1 2 3 4; do
            if git push --force "$remote" HEAD:cli-dist; then
              echo "Push succeeded on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Push failed after 4 attempts" >&2
              exit 1
            fi
            sleep $((2 ** attempt))
          done
