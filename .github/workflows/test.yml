name: Run Tests

on:
  # Mirrors frontend-test.yml: the pipeline, generators and CI checks under
  # scripts/ are only exercised by this suite, so run it on any PR that touches
  # them. fixtures/ is in here for the same reason it is there — slug-cases.json
  # and shard-cases.json are what stop scripts/slug.py and scripts/shard.py
  # drifting from their JS counterparts, so a change to either has to re-run the
  # Python side too.
  pull_request:
    paths:
      - 'scripts/**'
      - 'fixtures/*.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      # TEMP(ubuntu-26.04 test): isolate the Ghostscript "Unable to open the
      # initial device" failure seen on 26.04. Is it the 26.04 image, or an
      # artefact of writing outside the repo checkout? REVERT BEFORE MERGE.
      - name: TEMP Ghostscript location/SAFER probe
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript --no-install-recommends
          gs --version
          echo "CWD=$(pwd)"

          src="data/raw/matters/MN-01068/Affidavit-of-Radu-Popescu.pdf"

          probe () {
            label="$1"; out="$2"; shift 2
            echo "::group::${label}"
            set +e
            gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.7 -dPDFSETTINGS=/ebook \
               -dNOPAUSE -dBATCH "$@" -sOutputFile="$out" "$src"
            echo "--> ${label}: exit=$?"
            set -e
            ls -la "$out" 2>/dev/null || echo "    (no output file)"
            echo "::endgroup::"
          }

          # A: inside the repo checkout (what compress_pdfs actually does), SAFER
          probe "A in-tree +SAFER"     "./.probe-a.pdf"              -dSAFER
          # B: RUNNER_TEMP (what my earlier test did), SAFER
          mkdir -p "${RUNNER_TEMP}/gs"
          probe "B runner-temp +SAFER" "${RUNNER_TEMP}/gs/b.pdf"     -dSAFER
          # C: RUNNER_TEMP without SAFER, to test whether SAFER is the cause
          probe "C runner-temp -SAFER" "${RUNNER_TEMP}/gs/c.pdf"     -dNOSAFER
          # D: in-tree, SAFER, with -dQUIET exactly as compress_pdfs runs it
          probe "D in-tree +SAFER -dQUIET" "./.probe-d.pdf"          -dSAFER -dQUIET

      - name: Run tests
        run: python -m pytest scripts/tests/ -v
