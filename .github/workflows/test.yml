name: Run Tests

on:
  # Mirrors frontend-test.yml: the pipeline, generators and CI checks under
  # scripts/ are only exercised by this suite, so run it on any PR that touches
  # them. fixtures/ is in here for the same reason it is there — slug-cases.json
  # and shard-cases.json are what stop scripts/slug.py and scripts/shard.py
  # drifting from their JS counterparts, so a change to either has to re-run the
  # Python side too.
  pull_request:
    paths:
      - 'scripts/**'
      - 'fixtures/*.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest scripts/tests/ -v
