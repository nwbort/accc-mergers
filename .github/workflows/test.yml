name: Run Tests

on:
  # Mirrors frontend-test.yml: the pipeline, generators and CI checks under
  # scripts/ are only exercised by this suite, so run it on any PR that touches
  # them. fixtures/ is in here for the same reason it is there — slug-cases.json
  # and shard-cases.json are what stop scripts/slug.py and scripts/shard.py
  # drifting from their JS counterparts, so a change to either has to re-run the
  # Python side too.
  pull_request:
    paths:
      - 'scripts/**'
      - 'fixtures/*.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      # TEMP(ubuntu-26.04 test): gs 10.06 cannot open compress_pdfs' output
      # file. Grid the variables one at a time to find which one it rejects.
      # REVERT BEFORE MERGE.
      - name: TEMP Ghostscript output-filename grid
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript --no-install-recommends
          gs --version
          src="data/raw/matters/MN-01068/Affidavit-of-Radu-Popescu.pdf"
          cp "$src" ./in.pdf

          try () {
            label="$1"; out="$2"; shift 2
            set +e
            err=$(gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.7 \
                     -dPDFSETTINGS=/prepress -dNOPAUSE -dBATCH -dSAFER \
                     "$@" -sOutputFile="$out" ./in.pdf 2>&1 >/dev/null)
            code=$?
            set -e
            if [ $code -eq 0 ]; then
              echo "PASS  ${label}  [${out}]"
            else
              echo "FAIL  ${label}  [${out}]  :: $(echo "$err" | grep -m1 'Could not open' || echo "$err" | head -1)"
            fi
            rm -f "$out"
          }

          echo "--- vary the FILENAME (compress_pdfs' extra flags held constant) ---"
          F="-dDetectDuplicateImages=true -dCompressFonts=true -dQUIET"
          try "plain .pdf"            "./out.pdf"                  $F
          try "leading dot, .pdf"     "./.out.pdf"                 $F
          try "plain .tmp"            "./out.tmp"                  $F
          try "leading dot, .tmp"     "./.out.tmp"                 $F
          try "compress_pdfs' exact"  "./.in.pdf.prepress.tmp"     $F

          echo "--- vary the FLAGS (filename held at compress_pdfs' exact form) ---"
          N="./.in.pdf.prepress.tmp"
          try "no extra flags"        "$N"
          try "+DetectDuplicateImages" "$N" -dDetectDuplicateImages=true
          try "+CompressFonts"        "$N" -dCompressFonts=true
          try "+QUIET"                "$N" -dQUIET

          echo "--- SAFER off, compress_pdfs' exact filename + flags ---"
          set +e
          gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.7 -dPDFSETTINGS=/prepress \
             -dDetectDuplicateImages=true -dCompressFonts=true -dNOPAUSE -dBATCH \
             -dQUIET -dNOSAFER -sOutputFile="$N" ./in.pdf
          echo "--> NOSAFER exit=$?"
          set -e

      - name: Run tests
        run: python -m pytest scripts/tests/ -v
