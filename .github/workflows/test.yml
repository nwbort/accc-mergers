name: Run Tests

on:
  # Mirrors frontend-test.yml: the pipeline, generators and CI checks under
  # scripts/ are only exercised by this suite, so run it on any PR that touches
  # them. fixtures/ is in here for the same reason it is there — slug-cases.json
  # and shard-cases.json are what stop scripts/slug.py and scripts/shard.py
  # drifting from their JS counterparts, so a change to either has to re-run the
  # Python side too.
  pull_request:
    paths:
      - 'scripts/**'
      - 'fixtures/*.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      # TEMP(ubuntu-26.04 test): plain gs works on 26.04 (location/SAFER ruled
      # out), so reproduce compress_pdfs' exact invocation to find what differs.
      # REVERT BEFORE MERGE.
      - name: TEMP Ghostscript compress_pdfs reproduction
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript --no-install-recommends
          gs --version; echo "CWD=$(pwd)"
          src="data/raw/matters/MN-01068/Affidavit-of-Radu-Popescu.pdf"

          # 1. compress_pdfs on a copy INSIDE the repo tree (the real code path)
          echo "::group::1. compress_pdfs in-tree"
          cp "$src" ./gs-intree.pdf
          python -m scripts.compress_pdfs --target 838860 ./gs-intree.pdf
          echo "--> exit=$?  size=$(stat -c%s ./gs-intree.pdf)"
          echo "::endgroup::"

          # 2. compress_pdfs on a copy in RUNNER_TEMP (what failed earlier)
          echo "::group::2. compress_pdfs runner-temp"
          mkdir -p "${RUNNER_TEMP}/gs2"; cp "$src" "${RUNNER_TEMP}/gs2/s.pdf"
          python -m scripts.compress_pdfs --target 838860 "${RUNNER_TEMP}/gs2/s.pdf"
          echo "--> exit=$?  size=$(stat -c%s "${RUNNER_TEMP}/gs2/s.pdf")"
          echo "::endgroup::"

          # 3. compress_pdfs' exact gs argv, run by hand with stderr shown
          echo "::group::3. exact argv, stderr visible"
          set +e
          gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.7 -dPDFSETTINGS=/prepress \
             -dDetectDuplicateImages=true -dCompressFonts=true \
             -dNOPAUSE -dBATCH -dQUIET -dSAFER \
             -sOutputFile="./.gs-intree.pdf.prepress.tmp" "./gs-intree.pdf"
          echo "--> exact argv in-tree: exit=$?"
          set -e
          echo "::endgroup::"

      - name: Run tests
        run: python -m pytest scripts/tests/ -v
