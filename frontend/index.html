<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />

    <!-- Warm the data fetches the Dashboard needs, but only on the homepage.
         These files aren't used by other routes, so loading them site-wide
         would waste bandwidth. The fetch() that then asks for stats.json
         (preloadRoute in routes.js, before the app mounts) and the dashboard's
         for upcoming-events.json match the preload (same URL, CORS mode, same
         credentials) and reuse it. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p !== '/' && p !== '/index.html') return;
        var paths = ['/data/stats.json', '/data/upcoming-events.json'];
        for (var i = 0; i < paths.length; i++) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          // fetch() requests in CORS mode, even same-origin; a fetch preload
          // only matches it with crossorigin set, or the file downloads twice.
          link.crossOrigin = 'anonymous';
          link.href = paths[i];
          document.head.appendChild(link);
        }
      })();
    </script>

    <!-- SEO Meta Tags (data-rh: see RH in prerender.js) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta data-rh="true" name="description" content="Track Australian mergers reviewed by the ACCC — decisions, timelines, industry trends, and consultation documents." />
    <meta name="keywords" content="ACCC, mergers, acquisitions, Australia, competition, antitrust, merger review, corporate mergers" />
    <meta name="author" content="Nick Twort" />
    <meta name="theme-color" content="#335145" />
    <meta name="msvalidate.01" content="55FE5385DD2794F88A353F21FE08BB2E" />

    <!-- Open Graph Meta Tags -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="Australian Merger Tracker | ACCC Merger Reviews & M&A Data" />
    <meta data-rh="true" property="og:description" content="Track Australian mergers reviewed by the ACCC — decisions, timelines, industry trends, and consultation documents." />
    <meta data-rh="true" property="og:url" content="https://mergers.fyi" />
    <meta data-rh="true" property="og:site_name" content="Australian Merger Tracker" />
    <meta data-rh="true" property="og:image" content="https://mergers.fyi/og-image.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />

    <!-- Twitter Card Meta Tags -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Australian Merger Tracker | ACCC Merger Reviews & M&A Data" />
    <meta data-rh="true" name="twitter:description" content="Track Australian mergers reviewed by the ACCC — decisions, timelines, industry trends, and consultation documents." />
    <meta data-rh="true" name="twitter:image" content="https://mergers.fyi/og-image.png" />

    <!-- RSS Feed -->
    <link rel="alternate" type="application/atom+xml" title="Australian Merger Tracker Feed" href="/feed.xml" />

    <!-- Inter is self-hosted; preload the woff2 so the browser can start
         fetching it during HTML parse, before the inlined @font-face is seen.
         crossorigin is required because @font-face requests are CORS-mode,
         even for same-origin URLs - without it the browser would issue a
         second request. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <!-- Favicons and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Australian Merger Tracker | ACCC Merger Reviews & M&A Data</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
